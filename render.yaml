# One-click backend on Render: dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: splice
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "7860"
      - key: ALLOWED_ORIGIN
        value: "*"          # tighten to your Pages URL once it works
      - key: MAX_UPLOAD_MB
        value: "150"        # free instances have little memory/disk
      - key: GEMINI_API_KEY # optional: lets visitors use the app without their own key
        sync: false
