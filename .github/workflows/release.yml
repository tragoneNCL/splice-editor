# Builds downloadable apps (UI + engine in one file) for Mac, Windows and Linux.
# Create a release by pushing a tag:  git tag v1.0.0 && git push --tags
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          set -e
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            ext=""; [ "$os" = windows ] && ext=".exe"
            name="splice-${GITHUB_REF_NAME}-${os}-${arch}"
            mkdir -p "dist/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "dist/$name/splice$ext" ./cmd/server
            cp README.md "dist/$name/"
            (cd dist && if [ "$os" = windows ]; then zip -qr "$name.zip" "$name"; else tar czf "$name.tar.gz" "$name"; fi)
            rm -rf "dist/$name"
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Splice $GITHUB_REF_NAME" --generate-notes
